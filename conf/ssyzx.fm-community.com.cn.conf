  server {
        listen 80;  
        server_name ssyzx.fm-community.com.cn;
	
        #charset koi8-r;

        #access_log  logs/host.access.log  main;
  
        
		#ignore favicon.ico not exist.  
		location = /favicon.ico {  
			#root   html;
			proxy_pass http://localhost:38087/; 
		} 
		
		#配置根目录映射到丰城项目
		location / {
            alias   E:/ssyzx/front/;
        }
        
        location /platform {
            proxy_pass   http://127.0.0.1:8982/platform;
        #    index  index.html index.htm;
        }
      
        location /site {
            proxy_pass   http://127.0.0.1:8908/site;
        #    index  index.html index.htm;
        }

        location /filemodule/ {
			proxy_pass http://localhost:8903/filemodule/;
            #index  index.html index.htm;
        }
        #shuiguohu school
        location /security/ {
			proxy_pass http://localhost:8906/security/;
            #index  index.html index.htm;
        }
        
		location /location/ {
			proxy_pass http://localhost:8984/location/;
            #index  index.html index.htm;
        }
		
		#公用文件映射地址
		location /fileserver {
            alias   E:/fileserver/;
        #    index  index.html index.htm;
        }
	
	
        #ssyzx peizhi
		location /ssyzx {
            alias   E:/ssyzx/;
        #    index  index.html index.htm;
        }
        
		location /admin {
            proxy_pass   http://127.0.0.1:8908/admin;
        #    index  index.html index.htm;
        }
		
		location /front {
            proxy_pass   http://127.0.0.1:8908/front;
        #    index  index.html index.htm;
        }
        
        location /campusoa {
            proxy_pass   http://127.0.0.1:8909/campusoa;
        #    index  index.html index.htm;
        }
		
		
		
        #error_page  404              /404.html;

        # redirect server error pages to the static page /50x.html
        #
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
        

