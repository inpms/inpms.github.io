  server {
        listen 80;  
		listen 443 ssl; 
        server_name fengcheng.fm-community.com.cn;
	

		#配置ssl
       ssl_certificate      C://BtSoft//nginx//conf//vhost//cert//fengcheng.fm-community.com.cn.pem;
       ssl_certificate_key  C://BtSoft//nginx//conf//vhost//cert//fengcheng.fm-community.com.cn.key;

       ssl_session_timeout             5m;
       ssl_protocols                   SSLv3 TLSv1 TLSv1.1 TLSv1.2;
       ssl_ciphers                     HIGH:!aNULL:!MD5;
       ssl_prefer_server_ciphers       on;
	   
       
        location /ws {
              
                proxy_set_header  Host $host;
                proxy_set_header  X-Real-IP  $remote_addr;
                proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header  X-Forwarded-Proto   $scheme;
                proxy_pass        https://fengcheng.fm-community.com.cn:9528/webSocket;

            
                
                
                # 关键配置 start
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_read_timeout 36000s;

                }


        #charset koi8-r;

        #access_log  logs/host.access.log  main;
  
        
		#ignore favicon.ico not exist.  
		location = /favicon.ico {  
			#root   html;
			proxy_pass http://localhost:38087/; 
		} 
		
		#配置根目录映射到丰城项目
		location / {
        #   root   html;
			#设置主机头和客户端真实地址，以便服务器获取客户端真实IP
			proxy_set_header Host $host;
            proxy_set_header Referer $http_referer;
            proxy_set_header Cookie $http_cookie;   
            proxy_set_header X-Real-Ip $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
			proxy_cookie_path / "/; httponly; secure; SameSite=Lax";
            index  index.html index.htm;
			proxy_pass http://localhost:38087/;
        }
        
        
		
